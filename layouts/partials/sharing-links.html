{{ with .Params.sharingLinks | default (.Site.Params.article.sharingLinks | default false) }}
  {{ $links := hugo.Data.sharing }}
  <section class="flex flex-row flex-wrap justify-center pt-4 text-xl">
    {{ range . }}
      {{ if eq . "copy" }}
        <button
          id="copy-link-btn"
          class="m-1 rounded bg-neutral-300 p-1.5 text-neutral-700 hover:bg-primary-500 hover:text-neutral dark:bg-neutral-700 dark:text-neutral-300 dark:hover:bg-primary-400 dark:hover:text-neutral-800 transition-colors cursor-pointer"
          onclick="navigator.clipboard.writeText(window.location.href); const el = this; const originalTitle = el.getAttribute('title'); el.setAttribute('title', 'Copied!'); setTimeout(() => el.setAttribute('title', originalTitle), 2000);"
          title="Copy link to clipboard"
          aria-label="Copy link to clipboard">
          {{ partial "icon.html" "link" }}
        </button>
      {{ else }}
        {{ with index $links . }}
          <a
            class="m-1 rounded bg-neutral-300 p-1.5 text-neutral-700 hover:bg-primary-500 hover:text-neutral dark:bg-neutral-700 dark:text-neutral-300 dark:hover:bg-primary-400 dark:hover:text-neutral-800"
            target="_blank"
            href="{{ printf .url $.Permalink $.Title | safeURL }}"
            title="{{ i18n .title }}"
            aria-label="{{ i18n .title }}">
            {{ partial "icon.html" .icon }}
          </a>
        {{ end }}
      {{ end }}
    {{ end }}
  </section>
{{ end }}
